spring:
  application:
    name: All4Runner
  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.host:6379}
    datasource:
      hikari:
        maximum-pool-size: 100
  datasource:
    url: jdbc:postgresql://localhost:5432/All4Runner
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:wjd747}
  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: create
  sql:
    init:
      mode: always

logging:
  config:
    classpath:logback.xml
  level:
    com:
      uos:
        all4runner:
          common:
            filter: trace

jwt:
  keyId: ${keyId:topofthehead}
  accessTokenExpiration: ${accessTokenMinute:5}
  refreshTokenExpiration: ${refreshTokenMinute:720}